    <style>
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; padding-top: 20px; width: 100%; box-sizing: border-box; }
        
        @media (min-width: 1600px) {
            .dashboard-container { max-width: 1600px; }
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #00525d;
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            animation: fadeInScale 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        .page-title::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 3s infinite;
        }
        .page-title i {
            color: #ffffff;
            font-size: 24px;
            animation: iconBounce 2s ease-in-out infinite;
        }
        .page-title:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 82, 93, 0.2);
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .page-title i {
            color: #ffffff;
        }
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes shimmer {
            0% {
                left: -100%;
            }
            50%, 100% {
                left: 100%;
            }
        }
        @keyframes iconBounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        /* Section heading */
        .section-heading {
            font-size: 13px; font-weight: 700; color: var(--text-3);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 14px; margin-top: 16px;
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }

        /* Glass card */
.glass-card {
background: var(--surface);
backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
border: 1px solid var(--border); border-radius: var(--r-xl);
padding: 24px; margin-bottom: 20px;
}

        /* Menu sections */
        .menu-section {
            background: var(--surface);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
            border: 1px solid var(--border); border-radius: var(--r-lg);
            padding: 24px; margin-bottom: 20px;
        }

        /* Page Navigation Tabs */
        .menu-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 8px;
            background: var(--surface-muted);
            border-radius: var(--r-md);
        }

        .menu-nav-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: var(--r-sm);
            background: transparent;
            color: var(--text-3);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .menu-nav-btn:hover {
            background: var(--surface-strong);
            color: var(--text-2);
        }
        .menu-nav-btn::before {
            content: "";
            position: absolute;
            left: -50px;
            top: 0;
            width: 0;
            height: 100%;
            background-color: var(--brand-600);
            transform: skewX(45deg);
            z-index: -1;
            transition: width 1000ms;
        }
        .menu-nav-btn:hover::before {
            width: 250%;
        }
        [data-theme="light"] .menu-nav-btn:hover {
            color: #ffffff;
        }
        .menu-nav-btn.active {
            background: var(--brand-700);
            color: white;
            box-shadow: 0 4px 12px rgba(0,82,93,0.3);
            overflow: hidden;
        }
        .menu-nav-btn.active::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine-wave 2s linear infinite;
        }
        @keyframes shine-wave {
            0% {
                left: -100%;
            }
            100% {
                left: 200%;
            }
        }

        @media (max-width: 640px) {
            .menu-nav-btn {
                flex: 1;
                justify-content: center;
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        /* Page sections */
        .menu-page-section {
            display: none;
        }
        .menu-page-section.active {
            display: block;
        }

        .menu-section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-section-title i {
            color: var(--brand-700);
            font-size: 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* Menu table */
        .menu-table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 60vh;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .menu-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }
        #səhər .menu-table { min-width: 620px; }
        #günorta .menu-table { min-width: 1080px; }
        .menu-table thead th {
            background: #ffffff;
            padding: 12px 16px;
            text-align: center;
            font-weight: 700;
            color: var(--text-1);
            border: 1px solid rgba(0, 82, 93, 0.55);
            border-bottom: 2px solid rgba(0, 82, 93, 0.85);
            white-space: normal;
            overflow-wrap: break-word;
            word-wrap: break-word;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        [data-theme="dark"] .menu-table thead th {
            background: #13252a;
        }
        .menu-table tbody td {
            padding: 12px 16px;
            border: 1px solid rgba(0, 82, 93, 0.45);
            vertical-align: middle;
            white-space: normal;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        [data-theme="dark"] .menu-table thead th {
            border-color: rgba(255, 255, 255, 0.2);
            border-bottom-color: rgba(255, 255, 255, 0.28);
        }
        [data-theme="dark"] .menu-table tbody td {
            border-color: rgba(255, 255, 255, 0.16);
        }
        .menu-table tbody tr:hover td {
            background: var(--surface-muted);
        }
        .menu-table tbody tr:nth-child(even) td {
            background: var(--surface-muted);
        }
        .menu-table tbody tr:nth-child(even):hover td {
            background: var(--surface-strong);
        }
        .menu-table .date-cell {
            font-weight: 700;
            color: var(--text-1);
            white-space: normal;
            overflow-wrap: break-word;
            word-wrap: break-word;
            text-align: center;
        }
        .menu-table td[contenteditable="true"] {
            min-width: 0;
            padding: 12px 16px;
            border: 1px solid rgba(0, 82, 93, 0.45);
            border-radius: 0;
            background: transparent;
            min-height: 24px;
        }
        .menu-table td[contenteditable="true"]:hover {
            background: var(--surface-muted);
            border-color: rgba(0, 82, 93, 0.6);
        }
        [data-theme="dark"] .menu-table td[contenteditable="true"]:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }
        .menu-table td[contenteditable="true"]:focus {
            border-color: var(--brand-700);
            outline: none;
            box-shadow: none;
        }

            top: auto !important;
            left: auto !important;
            background: transparent;
            border: none;
            box-shadow: none;

        .flatpickr-calendar .flatpickr-months .flatpickr-month,

        .flatpickr-calendar .flatpickr-current-month input.cur-year {

        }
        .flatpickr-calendar .numInputWrapper span.arrowUp:after,

        }
        .flatpickr-calendar .flatpickr-monthDropdown-months .flatpickr-monthDropdown-month:hover {

        [data-theme="dark"] .flatpickr-calendar .flatpickr-monthDropdown-months {

        [data-theme="dark"] .flatpickr-calendar .flatpickr-monthDropdown-months .flatpickr-monthDropdown-month:hover {
            background: var(--brand-700) !important;

        }
        /* Ay dəyişmə oxları (düymələr) - cap_teleb.html ilə eyni */

        .flatpickr-calendar .flatpickr-next-month {

        [data-theme="dark"] .flatpickr-calendar .flatpickr-next-month {
            color: #fff;
            fill: #fff;

        [data-theme="dark"] .flatpickr-calendar .flatpickr-next-month:hover {
            color: #fff;
            fill: #fff;
        }
        /* İl dəyişmə oxları (numInputWrapper) - defolt (mövzu təyin olunmayanda), hover olmadan da görünsün */

        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span:hover,

        }
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span::before,
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span::after,
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span:hover::before,
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span:hover::after {
            border-top-color: #000000 !important;
            border-bottom-color: #000000 !important;
        }
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span.arrowUp::before,
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span.arrowUp::after,
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span.arrowUp:hover::before,
        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span.arrowUp:hover::after {

        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span.arrowDown::before,

        .flatpickr-calendar .flatpickr-current-month .numInputWrapper span.arrowDown:hover::after {

        }
        .flatpickr-calendar .flatpickr-weekday {
            color: var(--text-2);

        }

        }

        .flatpickr-calendar .flatpickr-day.nextMonthDay {
            opacity: 0.3;
        }

        }
        .flatpickr-calendar .flatpickr-day.selected,
        .flatpickr-calendar .flatpickr-day.startRange,
        .flatpickr-calendar .flatpickr-day.endRange,
        .flatpickr-calendar .flatpickr-day.selected.inRange,

        }
        /* "Bir Neçə Tarix Əlavə Et" rejimində seçilən günlər yaşıl dairə */

        .picker-multi-cal .flatpickr-day.selected:hover,

        /* Cədvəldə artıq mövcud olan tarixlər - açıq yaşıl dairə */

        [data-theme="dark"] .flatpickr-calendar .flatpickr-prev-month,

    <script>
        // Azerbaijani locale for Flatpickr
        const azLocale = {
            weekdays: {
                shorthand: ['B.', 'B.E.', 'Ç.A.', 'Ç.', 'C.A.', 'C.', 'Ş.'],
                longhand: ['Bazar', 'Bazar Ertəsi', 'Çərşənbə Axşamı', 'Çərşənbə', 'Cümə Axşamı', 'Cümə', 'Şənbə']
            },
            months: {
                shorthand: ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'İyn', 'İyl', 'Avq', 'Sen', 'Okt', 'Noy', 'Dek'],
                longhand: ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr']
            },
            firstDayOfWeek: 1,
            ordinal: function(nth) {
                if (nth > 1) return '';
                return '-';
            },
            rangeSeparator: ' - ',
            weekAbbreviation: 'Həftə',
            scrollTitle: 'Scroll to increment',
            toggleTitle: 'Click to toggle',
            amPM: ['AM', 'PM'],
            yearAriaLabel: 'Year',
            monthAriaLabel: 'Month',
            hourAriaLabel: 'Hour',
            minuteAriaLabel: 'Minute',
            time_24hr: true
        };

        // Get day name in Azerbaijani
        function getDayName(dateStr) {
            const days = ['Bazar', 'Bazar Ertəsi', 'Çərşənbə Axşamı', 'Çərşənbə', 'Cümə Axşamı', 'Cümə', 'Şənbə'];
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const p = dateStr.split('-');
                return days[new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2])).getDay()];
            }
            const date = new Date(dateStr + 'T00:00:00');
            return days[date.getDay()];
        }

        // Format date as "dd Month - Day Name"
        function formatDateWithDay(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const months = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
            const monthName = months[dateObj.getMonth()];
            const dayName = getDayNameFromDate(dateObj);
            return `${day} ${monthName} - ${dayName}`;
        }

        // Get day name in Azerbaijani from Date object
        // 2 sözlü günlər qısaldılır: "Bazar Ertəsi" -> "B. Ertəsi", "Çərşənbə Axşamı" -> "Ç. Axşamı"
        function getDayNameFromDate(dateObj) {
            const days = ['Bazar', 'Bazar Ertəsi', 'Çərşənbə Axşamı', 'Çərşənbə', 'Cümə Axşamı', 'Cümə', 'Şənbə'];
            const name = days[dateObj.getDay()];
            const words = name.split(' ');
            if (words.length === 2) {
                return words[0].charAt(0) + '. ' + words[1];
            }
            return name;
        }

        // Parse date from various formats and return Date object
        function parseDate(dateStr) {
            // If it's already ISO format (YYYY-MM-DD)
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const p = dateStr.split('-');
                return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
            }
            
            // If it's in Azerbaijani format like "15 Yanvar - Çərşənbə"
            const months = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
            const parts = dateStr.split(' ');
            if (parts.length >= 2) {
                const day = parseInt(parts[0]);
                const monthName = parts[1];
                const monthIndex = months.indexOf(monthName);
                if (day && monthIndex !== -1) {
                    // Use a default year (2024) for sorting purposes
                    const year = 2024;
                    return new Date(year, monthIndex, day);
                }
            }
            
            // Fallback: try to parse as-is
            const parsed = new Date(dateStr);
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        // Convert date to ISO format (YYYY-MM-DD)
        function toISOFormat(dateStr) {
            // ISO format (YYYY-MM-DD) — birbaşa qaytar, Date obyekti yaratma (timezone offset səhv edir)
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return dateStr;
            }
            const date = parseDate(dateStr);
            if (!date) return dateStr;
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        // Open date picker (single date auto-add, multi via button)
        function openDatePicker(menuType) {
            const tableBody = document.querySelector(`#${menuType} .menu-table tbody`);
            const lastFocused = document.activeElement;
            
            // Overlay
            const overlay = document.createElement('div');
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            overlay.setAttribute('aria-label', 'Tarix seçin');
            overlay.style.cssText = `
                position: fixed; top:0; left:0; width:100%; height:100%;
                background: rgba(0,0,0,0.5); z-index:9999;
                display:flex; align-items:center; justify-content:center;
                font-family: 'Poppins', sans-serif;
            `;
            
            // Card
            const card = document.createElement('div');
            card.style.cssText = `
                background: var(--surface); border: 1px solid var(--border);
                border-radius: var(--r-lg); padding: 24px;
                box-shadow: 0 16px 48px rgba(0,0,0,0.3);
                max-width: 400px; width: 100%;
            `;
            
            // Header
            const header = document.createElement('div');
            header.style.cssText = `
                font-size: 14px; font-weight: 600; color: var(--text-1);
                margin-bottom: 12px; text-align: center; min-height: 20px;
            `;
            header.textContent = 'Tarix seçin';
            card.appendChild(header);
            
            // Flatpickr placeholder
            const pickerPlace = document.createElement('div');
            card.appendChild(pickerPlace);
            
            // Mode button - "Bir Neçə Tarix Əlavə Et"
            const modeBtn = document.createElement('button');
            modeBtn.type = 'button';
            modeBtn.className = 'btn btn-secondary';
            modeBtn.innerHTML = '<i class="fa-solid fa-calendar-plus"></i> Bir Neçə Tarix Əlavə Et';
            modeBtn.style.cssText = 'width: 100%; padding: 10px 20px; font-size: 13px; margin-top: 12px; font-family: Poppins, sans-serif;';
            card.appendChild(modeBtn);
            
            // Action row (hidden by default, shown only in multi mode)
            const actions = document.createElement('div');
            actions.style.cssText = `
                display: none; gap: 10px; justify-content: center; margin-top: 14px;
            `;
            
            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'btn btn-secondary';
            cancelBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> Ləğv et';
            cancelBtn.style.cssText = 'padding: 8px 20px; font-size: 13px; font-family: Poppins, sans-serif;';
            
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'btn btn-primary';
            addBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Əlavə et';
            addBtn.disabled = true;
            addBtn.style.cssText = 'padding: 8px 20px; font-size: 13px; opacity: 0.5; cursor: not-allowed; font-family: Poppins, sans-serif;';
            
            actions.appendChild(cancelBtn);
            actions.appendChild(addBtn);
            card.appendChild(actions);
            overlay.appendChild(card);
            document.body.appendChild(overlay);

            // Ekranın boş yerinə kliklənəndə təqvimi bağla
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closePicker();
            });

            // Escape ilə bağla + focus trap (Tab diyaloq daxilində qalır)
            overlay.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    e.stopPropagation();
                    closePicker();
                    return;
                }
                if (e.key === 'Tab') {
                    const focusables = card.querySelectorAll('button, [tabindex]:not([tabindex="-1"])');
                    if (focusables.length === 0) return;
                    const first = focusables[0];
                    const last = focusables[focusables.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            });
            
            let multiMode = false;
            let selectedDatesArr = [];
            let pickerInstance = null;
            
            function addSelectedDates() {
                if (selectedDatesArr.length === 0) return;
                selectedDatesArr.sort((a, b) => a - b);
                for (const dateObj of selectedDatesArr) {
                    const dateISO = dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                    addNewRow(tableBody, formatDateWithDay(dateObj), menuType, dateISO);
                }
                const count = selectedDatesArr.length;
                cleanupPicker();
                if (overlay.parentNode) document.body.removeChild(overlay);
                window.showToast(count + ' tarix əlavə edildi', 'success');
            }
            
            // Tək tarix rejimində artıq mövcud tarixin seçilməsini blokla
            function addSingleDate(dateObj) {
                const dateISO = dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                if (getExistingDates().has(dateISO)) {
                    window.showToast('Bu tarix artıq menyuda mövcuddur', 'warning');
                    return false;
                }
                addNewRow(tableBody, formatDateWithDay(dateObj), menuType, dateISO);
                cleanupPicker();
                if (overlay.parentNode) document.body.removeChild(overlay);
                return true;
            }
            
            function closePicker() {
                cleanupPicker();
                if (overlay.parentNode) document.body.removeChild(overlay);
                if (lastFocused && lastFocused.focus) lastFocused.focus();
            }
            
            // Təqvimi təmizlə — destroy() istifadə etmirik (div-i DOM-dan çıxarır)
            function cleanupPicker() {
                if (pickerInstance) {
                    try {
                        if (pickerInstance.calendarContainer && pickerInstance.calendarContainer.parentNode) {
                            pickerInstance.calendarContainer.parentNode.removeChild(pickerInstance.calendarContainer);
                        }
                    } catch(e) {}
                    pickerInstance = null;
                }
                try { delete pickerPlace._flatpickr; } catch(e) {}
                pickerPlace.textContent = '';
            }
            
            // Ay oxlarını rənglə (inline style + important ilə CSS keçilə bilməz)
            function colorMonthArrows() {
                if (!pickerInstance || !pickerInstance.calendarContainer) return;
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const c = isDark ? '#ffffff' : '#000000';
                pickerInstance.calendarContainer.querySelectorAll(
                    '.flatpickr-prev-month, .flatpickr-next-month, ' +
                    '.flatpickr-prev-month svg, .flatpickr-next-month svg, ' +
                    '.flatpickr-prev-month svg path, .flatpickr-next-month svg path'
                ).forEach(function(el) {
                    el.style.setProperty('color', c, 'important');
                    el.style.setProperty('fill', c, 'important');
                    el.style.setProperty('fill-opacity', '1', 'important');
                    el.style.setProperty('stroke', c, 'important');
                    el.style.setProperty('stroke-opacity', '1', 'important');
                });
            }
            
            function fixMonthDropdown() {
                setTimeout(function() {
                    const dd = document.querySelector('.flatpickr-monthDropdown-months');
                    if (dd) {
                        dd.style.background = 'var(--surface-strong)';
                        dd.style.border = '1px solid var(--border)';
                        dd.querySelectorAll('.flatpickr-monthDropdown-month').forEach(function(item) {
                            item.style.color = 'var(--text-1)';
                            item.style.background = 'transparent';
                        });
                    }
                }, 10);
            }
            
            // Cədvəldəki mövcud tarixləri topla
            function getExistingDates() {
                const s = new Set();
                tableBody.querySelectorAll('tr').forEach(function(row) {
                    if (row.dataset.dateISO) s.add(row.dataset.dateISO);
                });
                return s;
            }
            
            // Mövcud tarixləri yaşıl dairə ilə işarələ (flatpickr re-render olanda yenidən tətbiq olunur)
            function markExistingDates() {
                if (!pickerInstance || !pickerInstance.calendarContainer || !multiMode) return;
                var existingDates = getExistingDates();
                if (existingDates.size === 0) return;
                pickerInstance.calendarContainer.querySelectorAll('.flatpickr-day:not(.prevMonthDay):not(.nextMonthDay)').forEach(function(el) {
                    if (el.dateObj) {
                        var iso = el.dateObj.getFullYear() + '-' + String(el.dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(el.dateObj.getDate()).padStart(2, '0');
                        if (existingDates.has(iso)) {
                            el.classList.add('existing-date');
                            el.title = 'Artıq əlavə edilib';
                        }
                    }
                });
            }

            // Həftəsonu günlərini təqvimdə işarələ (yeni ay açılarkən də yenidən tətbiq olunur)
            function markWeekendDays() {
                if (!pickerInstance || !pickerInstance.calendarContainer) return;
                pickerInstance.calendarContainer.querySelectorAll('.flatpickr-day').forEach(function(el) {
                    if (el.dateObj) {
                        const w = el.dateObj.getDay();
                        if (w === 0 || w === 6) el.classList.add('wknd');
                    }
                });
            }
            
            // Təqvim yarat — sadə və etibarlı
            function createPicker(mode) {
                selectedDatesArr = [];
                pickerInstance = flatpickr(pickerPlace, {
                    locale: azLocale,
                    dateFormat: 'd.m.Y',
                    firstDay: 1,
                    disableMobile: true,
                    monthSelectorType: 'static',
                    inline: true,
                    mode: mode,
                    // Həftəsonu işarəsi onReady ilə — onDayCreate bu flatpickr versiyasında təqvimin qurulmasını pozur
                    onReady: function(selectedDates, dateStr, instance) {
                        if (instance && instance.dayElements) {
                            instance.dayElements.forEach(function(el) {
                                if (el.dateObj) {
                                    const w = el.dateObj.getDay();
                                    if (w === 0 || w === 6) el.classList.add('wknd');
                                }
                            });
                        }
                    },
                    onMonthChange: function() {
                        fixMonthDropdown();
                        colorMonthArrows();
                        markExistingDates();
                        markWeekendDays();
                    },
                    onOpen: fixMonthDropdown,
                    onChange: function(selectedDates) {
                        selectedDatesArr = selectedDates;
                        if (!multiMode) {
                            if (selectedDates.length > 0) addSingleDate(selectedDates[0]);
                            return;
                        }
                        if (selectedDates.length > 0) {
                            header.textContent = selectedDates.length + ' tarix seçildi';
                            header.style.fontSize = '14px';
                            addBtn.disabled = false;
                            addBtn.style.opacity = '1';
                            addBtn.style.cursor = 'pointer';
                        } else {
                            header.textContent = 'Birdən çox tarix seçin';
                            header.style.fontSize = '14px';
                            addBtn.disabled = true;
                            addBtn.style.opacity = '0.5';
                            addBtn.style.cursor = 'not-allowed';
                        }
                        markExistingDates();
                    }
                });
                if (!pickerInstance) return;
                if (pickerInstance.calendarContainer) {
                    pickerInstance.calendarContainer.classList.toggle('picker-multi-cal', mode === 'multiple');
                }
                colorMonthArrows();
                markWeekendDays();
                // Multi rejimdə artıq mövcud tarixləri vizual işarələ (post-render)
                if (mode === 'multiple') {
                    setTimeout(markExistingDates, 50);
                }
            }
            
            // "Bir Neçə Tarix Əlavə Et" — multi mode
            modeBtn.onclick = function() {
                cleanupPicker();
                multiMode = true;
                modeBtn.style.display = 'none';
                actions.style.display = 'flex';
                header.textContent = 'Birdən çox tarix seçin';
                createPicker('multiple');
                fixMonthDropdown();
            };
            
            cancelBtn.onclick = closePicker;
            addBtn.onclick = addSelectedDates;
            
            createPicker('single');
            fixMonthDropdown();

            // Klaviatura istifadəçiləri üçün diqqəti təqvimə yönəlt
            setTimeout(function() {
                if (pickerInstance && pickerInstance.calendarContainer) {
                    const firstDay = pickerInstance.calendarContainer.querySelector('.flatpickr-day:not(.prevMonthDay):not(.nextMonthDay)');
                    if (firstDay) firstDay.focus();
                }
            }, 50);

            // Təqvim açıqkən mövzu dəyişərsə ox rənglərini yenilə
            if (!window._yemekThemeArrowObserver) {
                window._yemekThemeArrowObserver = new MutationObserver(function() {
                    var c = document.documentElement.getAttribute('data-theme') === 'dark' ? '#ffffff' : '#000000';
                    document.querySelectorAll(
                        '.flatpickr-calendar .flatpickr-prev-month, .flatpickr-calendar .flatpickr-next-month, ' +
                        '.flatpickr-calendar .flatpickr-prev-month svg, .flatpickr-calendar .flatpickr-next-month svg, ' +
                        '.flatpickr-calendar .flatpickr-prev-month svg path, .flatpickr-calendar .flatpickr-next-month svg path'
                    ).forEach(function(el) {
                        el.style.setProperty('color', c, 'important');
                        el.style.setProperty('fill', c, 'important');
                        el.style.setProperty('fill-opacity', '1', 'important');
                        el.style.setProperty('stroke', c, 'important');
                        el.style.setProperty('stroke-opacity', '1', 'important');
                    });
                });
                window._yemekThemeArrowObserver.observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['data-theme']
                });
            }
        }

        // Add new row to table
        function addNewRow(tableBody, dateText, menuType, dateISO) {
            const newRow = document.createElement('tr');
            newRow.dataset.date = dateText;
            newRow.dataset.dateISO = dateISO;
            
            if (menuType === 'səhər') {
                newRow.innerHTML = `
                    <td style="text-align: center;">
                        <button type="button" class="btn-delete" aria-label="Sil" title="Sil" onclick="deleteRow(this, 'səhər')" style="background: #ef4444; color: white;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                    <td class="date-cell">${dateText}</td>
                    <td contenteditable="true" data-field="main_dish" data-placeholder="Daxil edin..." data-label="Ana yemək" aria-label="Ana yemək"></td>
                    <td contenteditable="true" data-field="side_dish" data-placeholder="Daxil edin..." data-label="Səhər yeməyi boşqabı" aria-label="Səhər yeməyi boşqabı"></td>
                `;
            } else {
                newRow.innerHTML = `
                    <td style="text-align: center;">
                        <button type="button" class="btn-delete" aria-label="Sil" title="Sil" onclick="deleteRow(this, 'günorta')" style="background: #ef4444; color: white;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                    <td class="date-cell">${dateText}</td>
                    <td contenteditable="true" data-field="soup" data-placeholder="Daxil edin..." data-label="Şorba" aria-label="Şorba"></td>
                    <td contenteditable="true" data-field="main_dish" data-placeholder="Daxil edin..." data-label="Ana yemək" aria-label="Ana yemək"></td>
                    <td contenteditable="true" data-field="garnish" data-placeholder="Daxil edin..." data-label="Qarnir" aria-label="Qarnir"></td>
                    <td contenteditable="true" data-field="salat" data-placeholder="Daxil edin..." data-label="Salat" aria-label="Salat"></td>
                    <td contenteditable="true" data-field="dessert" data-placeholder="Daxil edin..." data-label="Meyvə/Şirniyyat" aria-label="Meyvə/Şirniyyat"></td>
                    <td contenteditable="true" data-field="drinks" data-placeholder="Daxil edin..." data-label="İçəcək" aria-label="İçəcək"></td>
                `;
            }
            
            // Insert row in correct position based on date
            const existingRows = tableBody.querySelectorAll('tr');
            let inserted = false;
            
            for (const row of existingRows) {
                const existingDateISO = row.dataset.dateISO;
                if (existingDateISO && dateISO < existingDateISO) {
                    tableBody.insertBefore(newRow, row);
                    inserted = true;
                    break;
                }
            }
            
            if (!inserted) {
                tableBody.appendChild(newRow);
            }
            
            // Mark as having unsaved changes
            markUnsavedChanges(menuType);
            updateEmptyState(menuType);
            
            // Save to Supabase
            saveNewRowToSupabase(newRow, menuType);
        }

        // Save new row to Supabase
        async function saveNewRowToSupabase(row, menuType) {
            const date = row.dataset.dateISO || row.dataset.date;
            const tableName = menuType === 'səhər' ? 'breakfast_menu' : 'lunch_menu';
            
            const data = { date: date };
            
            if (menuType === 'səhər') {
                data.main_dish = '';
                data.side_dish = '';
            } else {
                data.soup = '';
                data.main_dish = '';
                data.garnish = '';
                data.salad = '';
                data.dessert = '';
                data.drinks = '';
            }
            
            try {
                const { data: result, error } = await _menuDb
                    .from(tableName)
                    .insert([data])
                    .select();
                
                if (error) throw error;
                
                if (result && result.length > 0) {
                    row.dataset.id = result[0].id;
                }
            } catch (error) {
                console.error('Supabase error:', error);
            }
        }

        // Load menu from Supabase
        async function loadMenuFromSupabase() {
            try {
                console.log('Loading menu from Supabase...');
                
                // Load breakfast menu
                const { data: breakfastData, error: breakfastError } = await _menuDb
                    .from('breakfast_menu')

                        // Convert to ISO format if not already
                        const dateA = toISOFormat(a.date);
                        const dateB = toISOFormat(b.date);

                console.log('Breakfast data:', breakfastData);

                            <td contenteditable="true" data-field="side_dish" data-placeholder="Daxil edin..." data-label="Səhər yeməyi boşqabı" aria-label="Səhər yeməyi boşqabı">${window.esc(item.side_dish || '')}</td>

                    });

                console.log('Lunch data:', lunchData);
                console.log('Lunch error:', lunchError);
                
                if (lunchError) throw lunchError;
                
                const lunchBody = document.querySelector('#günorta .menu-table tbody');
                lunchBody.innerHTML = '';
                
                if (lunchData && lunchData.length > 0) {
                    console.log('Loading', lunchData.length, 'lunch rows');
                    lunchData.forEach(item => {
                        const row = document.createElement('tr');
                        row.dataset.id = item.id;
                        // Convert ISO date to display format if needed
                        let displayDate = item.date;
                        if (/^\d{4}-\d{2}-\d{2}$/.test(item.date)) {
                            const parts = item.date.split('-');
                            displayDate = formatDateWithDay(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])));

                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                            <td class="date-cell">${window.esc(displayDate)}</td>

                            <td contenteditable="true" data-field="main_dish" data-placeholder="Daxil edin..." data-label="Ana yemək" aria-label="Ana yemək">${window.esc(item.main_dish || '')}</td>
                            <td contenteditable="true" data-field="garnish" data-placeholder="Daxil edin..." data-label="Qarnir" aria-label="Qarnir">${window.esc(item.garnish || '')}</td>
                            <td contenteditable="true" data-field="salat" data-placeholder="Daxil edin..." data-label="Salat" aria-label="Salat">${window.esc(item.salat || '')}</td>
                            <td contenteditable="true" data-field="dessert" data-placeholder="Daxil edin..." data-label="Meyvə/Şirniyyat" aria-label="Meyvə/Şirniyyat">${window.esc(item.dessert || '')}</td>
                            <td contenteditable="true" data-field="drinks" data-placeholder="Daxil edin..." data-label="İçəcək" aria-label="İçəcək">${window.esc(item.drinks || '')}</td>

            } catch (error) {

        // Delegated listeners — sonradan əlavə olunan sətirlər də daxil,
        // hər hansı contenteditable xanasında dəyişiklik ediləndə işləyir.
        // Avtomatik yadda saxlanma YOXDUR — məlumat yalnız "Yadda saxla" düyməsi ilə bazaya yazılır.
        document.addEventListener('input', function(e) {
            const cell = e.target.closest ? e.target.closest('td[contenteditable="true"]') : null;
            if (cell) {
                const section = cell.closest('.menu-page-section');
                markUnsavedChanges(section ? section.id : null);
            }
        });

        function placeCaretAtEnd(el) {
            const range = document.createRange();
            range.selectNodeContents(el);
            range.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // Enter → növbəti xanaya keçir (Excel davranışı), Shift+Enter → yeni sətir
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            const cell = e.target.closest ? e.target.closest('td[contenteditable="true"]') : null;
            if (!cell) return;
            if (e.shiftKey) {
                e.preventDefault();
                document.execCommand('insertLineBreak');
                return;
            }
            e.preventDefault();
            const row = cell.closest('tr');
            const cells = row.querySelectorAll('td[contenteditable="true"]');
            const idx = Array.prototype.indexOf.call(cells, cell);
            if (idx < cells.length - 1) {
                cells[idx + 1].focus();
                placeCaretAtEnd(cells[idx + 1]);
            } else if (row.nextElementSibling) {
                const first = row.nextElementSibling.querySelector('td[contenteditable="true"]');
                if (first) {
                    first.focus();
                    placeCaretAtEnd(first);
                }
            }
        });

        // Ox düymələri ilə Excel kimi naviqasiya (contenteditable yemək xanaları)
        function _caretAtStart(cell){
            const sel=window.getSelection();
            if(!sel||!sel.rangeCount)return true;
            const r=sel.getRangeAt(0).cloneRange();
            r.selectNodeContents(cell);
            r.setEnd(sel.getRangeAt(0).startContainer,sel.getRangeAt(0).startOffset);
            return r.toString().length===0;
        }
        function _caretAtEnd(cell){
            const sel=window.getSelection();
            if(!sel||!sel.rangeCount)return true;
            const r=sel.getRangeAt(0).cloneRange();
            r.selectNodeContents(cell);
            r.setStart(sel.getRangeAt(0).endContainer,sel.getRangeAt(0).endOffset);
            return r.toString().length===0;
        }
        document.addEventListener('keydown',function(e){
            if(e.key!=='ArrowUp'&&e.key!=='ArrowDown'&&e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
            const cell=e.target.closest?e.target.closest('td[contenteditable="true"]'):null;
            if(!cell)return;
            const row=cell.closest('tr');
            if(!row)return;
            const editableInRow=Array.prototype.slice.call(row.querySelectorAll('td[contenteditable="true"]'));
            const myIdx=editableInRow.indexOf(cell);
            if(e.key==='ArrowUp'||e.key==='ArrowDown'){
                e.preventDefault();
                const targetRow=e.key==='ArrowDown'?row.nextElementSibling:row.previousElementSibling;
                if(!targetRow)return;
                const tCells=targetRow.querySelectorAll('td[contenteditable="true"]');
                if(!tCells.length)return;
                const tCell=tCells[Math.min(myIdx,tCells.length-1)];
                tCell.focus();placeCaretAtEnd(tCell);
                return;
            }
            if(e.key==='ArrowLeft'){
                if(!_caretAtStart(cell))return;
                if(myIdx>0){e.preventDefault();editableInRow[myIdx-1].focus();placeCaretAtEnd(editableInRow[myIdx-1]);}
                return;
            }
            if(e.key==='ArrowRight'){
                if(!_caretAtEnd(cell))return;
                if(myIdx<editableInRow.length-1){e.preventDefault();editableInRow[myIdx+1].focus();placeCaretAtEnd(editableInRow[myIdx+1]);}
                return;
            }
        });

        // Custom confirmation dialog
        function customConfirm(message) {
            return new Promise((resolve) => {
                const lastFocused = document.activeElement;
                // Create modal
                const modal = document.createElement('div');
                modal.setAttribute('role', 'dialog');
                modal.setAttribute('aria-modal', 'true');
                modal.setAttribute('aria-label', message);
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.7);
                    backdrop-filter: blur(5px);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                `;

                const dialog = document.createElement('div');
                dialog.style.cssText = `
                    background: #00525d;
                    border: 1px solid rgba(255,255,255,0.15);
                    border-radius: var(--r-lg);
                    padding: 24px;
                    max-width: 400px;
                    width: 90%;
                    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
                    animation: modalFadeIn 0.35s ease;
                `;

                const messageEl = document.createElement('p');
                messageEl.textContent = message;
                messageEl.style.cssText = `
                    font-size: 16px;
                    color: #ffffff;
                    margin-bottom: 20px;
                    font-family: 'Poppins', sans-serif;
                `;

                const buttonContainer = document.createElement('div');
                buttonContainer.style.cssText = `
                    display: flex;
                    gap: 12px;
                    justify-content: flex-end;
                `;

                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Ləğv et';
                cancelBtn.style.cssText = `
                    padding: 10px 20px;
                    border: 1px solid rgba(255,255,255,0.5);
                    border-radius: var(--r-sm);
                    background: transparent;
                    color: #ffffff;
                    cursor: pointer;
                    font-family: 'Poppins', sans-serif;
                    font-size: 14px;
                    transition: all 0.2s;
                `;

                const confirmBtn = document.createElement('button');
                confirmBtn.textContent = 'Bəli, sil';
                confirmBtn.style.cssText = `
                    padding: 10px 20px;
                    border: none;
                    border-radius: var(--r-sm);
                    background: #ef4444;
                    color: white;
                    cursor: pointer;
                    font-family: 'Poppins', sans-serif;
                    font-size: 14px;
                    transition: all 0.2s;
                `;

                buttonContainer.appendChild(cancelBtn);
                buttonContainer.appendChild(confirmBtn);
                dialog.appendChild(messageEl);
                dialog.appendChild(buttonContainer);
                modal.appendChild(dialog);
                document.body.appendChild(modal);

                cancelBtn.onclick = () => {
                    document.body.removeChild(modal);
                    resolve(false);
                    if (lastFocused && lastFocused.focus) lastFocused.focus();
                };

                confirmBtn.onclick = () => {
                    document.body.removeChild(modal);
                    resolve(true);
                    if (lastFocused && lastFocused.focus) lastFocused.focus();
                };

                modal.onclick = (e) => {
                    if (e.target === modal) {
                        document.body.removeChild(modal);
                        resolve(false);
                        if (lastFocused && lastFocused.focus) lastFocused.focus();
                    }
                };

                // Escape ilə ləğv et + focus trap
                modal.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        document.body.removeChild(modal);
                        resolve(false);
                        if (lastFocused && lastFocused.focus) lastFocused.focus();
                        return;
                    }
                    if (e.key === 'Tab') {
                        const focusables = dialog.querySelectorAll('button');
                        if (focusables.length === 0) return;
                        const first = focusables[0];
                        const last = focusables[focusables.length - 1];
                        if (e.shiftKey && document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        } else if (!e.shiftKey && document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                });
                cancelBtn.focus();
            });
        }

        // Track unsaved changes per menu tab
        let dirtyTabs = {};

        // Mark as having unsaved changes when content is edited
        function markUnsavedChanges(menuType) {
            if (menuType) {
                dirtyTabs[menuType] = true;
            } else {
                dirtyTabs['səhər'] = true;
                dirtyTabs['günorta'] = true;
            }
            if (window.markUnsaved) window.markUnsaved();
            updateDirtyUI(menuType);
        }

        // Save button state + "yadda saxlanılmamış" göstəricisini yenilə
        function updateDirtyUI(menuType) {
            if (!menuType) {
                updateDirtyUI('səhər');
                updateDirtyUI('günorta');
                return;
            }
            const btn = document.getElementById(`save-btn-${menuType}`);
            if (btn) btn.disabled = !dirtyTabs[menuType];
        }

        // Clear unsaved changes flag when saved
        function clearUnsavedChanges() {
            dirtyTabs = {};
            if (window.clearUnsaved) window.clearUnsaved();
            updateDirtyUI('səhər');
            updateDirtyUI('günorta');
        }

        // Empty state — cədvəl boş olanda istiqamətləndirici mesaj
        function updateEmptyState(menuType) {
            const tbody = document.querySelector(`#${menuType} .menu-table tbody`);
            if (!tbody) return;

            }

                // UNDO: təmizləmədən əvvəl anlıq görüntü

                var snapshotNotes = '';
                try {

        // Export to Excel
        function exportExcel(menuType) {

            const rows = tableBody.querySelectorAll('tr');
            console.log('Export Excel - Menu type:', menuType, 'Rows found:', rows.length);

            // Check if there's any data to export
            if (rows.length === 0 && !notes) {
                window.hideLoading();
                window.showToast('Menyu boşdur, ixrac ediləcək məlumat yoxdur', 'warning');
                return;
            }

            const data = [];

            if (menuType === 'səhər') {
                data.push(['Tarix', 'Ana yemək', 'Səhər yeməyi boşqabı']);
                console.log('Added breakfast header');
            } else {
                data.push(['Tarix', 'Şorba', 'Ana Yemək', 'Qarnir', 'Salat', 'Meyvə/Şirniyyat', 'İçəcək']);
                console.log('Added lunch header');
            }

            // Add data rows
            rows.forEach((row, rowIndex) => {
                if (row.classList.contains('empty-state')) return;
                const cells = row.querySelectorAll('td');
                const rowData = [];
                cells.forEach((cell, index) => {
                    if (index === 0) return; // Skip delete button column
                    rowData.push(cell.textContent);
                });
                data.push(rowData);
                console.log(`Row ${rowIndex}:`, rowData);
            });
            
            // Add notes row
            if (notes) {
                data.push(['']);
                data.push(['Qeydlər:']);
                data.push([notes]);
            }
            
            // Get first date for filename
            let monthName = '';
            let year = '';
            if (rows.length > 0) {
                const firstRow = rows[0];
                const dateISO = firstRow.dataset.dateISO;
                if (dateISO) {
                    const dp = dateISO.split('-');
                    const date = new Date(parseInt(dp[0]), parseInt(dp[1]) - 1, parseInt(dp[2]));
                    const azMonths = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
                    monthName = azMonths[date.getMonth()];
                    year = date.getFullYear();
                }
            }
            
            // Create workbook
            console.log('Creating Excel sheet with data:', data);
            const ws = XLSX.utils.aoa_to_sheet(data);

            if (!ws) {
                console.error('Failed to create worksheet');
                window.hideLoading();
                window.showToast('Excel iş yaratmaq mümkün olmadı', 'error');
                return;
            }

            // Set column widths
            if (menuType === 'səhər') {
                ws['!cols'] = [
                    { wch: 20 }, // Tarix
                    { wch: 30 }, // Ana yemək
                    { wch: 30 }  // Səhər yeməyi boşqabı
                ];
            } else {
                ws['!cols'] = [
                    { wch: 20 }, // Tarix
                    { wch: 25 }, // Şorba
                    { wch: 30 }, // Ana Yemək
                    { wch: 25 }, // Qarnir
                    { wch: 20 }, // Salat
                    { wch: 25 }, // Meyvə/Şirniyyat
                    { wch: 20 }  // İçkilər
                ];
            }

        async function getLogoBase64() {
            if (_logoBase64) return _logoBase64;
            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                await new Promise((resolve, reject) => {
                    img.onload  = resolve;
                    img.onerror = reject;
                    img.src = 'https://i.imgur.com/a3FuVV8.png';
                });
                const c = document.createElement('canvas');
                c.width = 200; c.height = 200;
                c.getContext('2d').drawImage(img, 0, 0, 200, 200);
                _logoBase64 = c.toDataURL('image/png');
                return _logoBase64;
            } catch (e) {
                console.warn('Loqo yüklənə bilmədi:', e);
                _logoBase64 = '';
                return null;
            }
        }

// TMV emblem loqosunu #00adba rəngində 5% opacity ilə qısa canvas-ə
        // çəkib PNG olaraq qaytarır (filigran). Kiçildilməsə jsPDF raw pikselləri
        // yenidən sıxıb PDF-ni şişirdirdi (720px -> ~16MB).

        async function getWatermarkBase64() {
            if (_watermarkBase64 !== undefined) return _watermarkBase64 || null;
            try {
                const img = new Image();
                await new Promise((resolve, reject) => {
                    img.onload  = resolve;
                    img.onerror = reject;
                    img.src = WATERMARK_DATA_URI;
                });
                const SIZE = 512;
                const c = document.createElement('canvas');
                c.width = SIZE; c.height = SIZE;
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, SIZE, SIZE);
                ctx.drawImage(img, 0, 0, SIZE, SIZE);
                const id = ctx.getImageData(0, 0, SIZE, SIZE);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) {
                    const a = (d[i + 3] / 255) * 0.06;
                    d[i]     = Math.round((1 - a) * 255);
                    d[i + 1] = Math.round((1 - a) * 255 + a * 173);
                    d[i + 2] = Math.round((1 - a) * 255 + a * 186);
                    d[i + 3] = 255;
                }
                ctx.putImageData(id, 0, 0);
                _watermarkBase64 = c.toDataURL('image/jpeg', 0.92);
                return _watermarkBase64;
            } catch (e) {
                console.warn('Filigran yaradıla bilmədi:', e);
                _watermarkBase64 = '';
                return null;
            }
        }

        function bufToBase64(buf) {
            let bin = '';
            const u8 = new Uint8Array(buf);
            for (let i = 0; i < u8.length; i++) {
                bin += String.fromCharCode(u8[i]);
            }
            return btoa(bin);
        }

        async function loadPoppinsFont(doc) {
            try {
                await window.loadPoppinsFontShared(doc);
                _fontLoaded = window._fontLoaded;
                console.log('Font yükleme durumu:', _fontLoaded ? 'Başarılı' : 'Başarısız');
            } catch(e) {
                console.error('Font yükleme hatası:', e);
                _fontLoaded = false;
            }
        }

        // Export to PDF — browser çap üsulu (logo çərçivəsiz)
        async function exportPDF(menuType) {
            const btn = document.getElementById(`pdf-btn-${menuType}`);
            btn.classList.add('btn-export-click');
            setTimeout(() => btn.classList.remove('btn-export-click'), 400);

            window.showLoading();
            const startTime = Date.now();

            try {
                const { jsPDF } = window.jspdf;
                if (!jsPDF) {
                    window.showToast('PDF kitabxanası yüklənməyib', 'error');
                    return;
                }

                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                await loadPoppinsFont(doc);
                const FN = _fontLoaded ? 'Poppins' : 'helvetica';

                const PW = 297;
                const PH = 210;
                const BH = 32;
                const footerH = 15;
                const TXL = 8, TXR = 8;
                const LOGO = 22;

                const logo = LOGO_DATA_URI;
                const watermark = await getWatermarkBase64();
                const wmSize = 150;
                const wmX = (PW - wmSize) / 2;
                const wmY = (PH - wmSize) / 2 + 4;

                const textX = TXL + LOGO + 2;

                const tableBody = document.querySelector(`#${menuType} .menu-table tbody`);
                const notesTextarea = document.getElementById(menuType === 'səhər' ? 'səhərNotes' : 'günortaNotes');
                const notes = notesTextarea ? notesTextarea.value : '';

                const rows = tableBody.querySelectorAll('tr');
                const tableData = [];

                rows.forEach(row => {
                    if (row.classList.contains('empty-state')) return;
                    const cells = row.querySelectorAll('td');
                    const rowData = [];
                    cells.forEach((cell, index) => {
                        if (index === 0) return;
                        rowData.push(cell.textContent);
                    });
                    tableData.push(rowData);
                });

                const columns = menuType === 'səhər'
                    ? ['Tarix', 'Ana yemək', 'Səhər yeməyi boşqabı']
                    : ['Tarix', 'Şorba', 'Ana Yemək', 'Qarnir', 'Salat', 'Meyvə/Şirniyyat', 'İçəcək'];

                function shortenDayName(dateStr) {
                    const sep = ' - ';
                    const idx = dateStr.indexOf(sep);
                    if (idx === -1) return dateStr;
                    const datePart = dateStr.substring(0, idx);
                    const dayWords = dateStr.substring(idx + sep.length).split(' ').filter(Boolean);
                    if (dayWords.length === 2) {
                        return datePart + sep + dayWords[0].charAt(0) + '. ' + dayWords[1];
                    }
                    return dateStr;
                }
                tableData.forEach(function(r) {
                    if (r[0]) r[0] = shortenDayName(r[0]);
                });

                const startY = BH + 6;
                const TM = 8;
                const TW = PW - TM - 8;

                doc.setFont(FN, 'normal');
                doc.setFontSize(8);
                let maxDateWidth = 0;
                tableData.forEach(function(r) {
                    const w = doc.getTextWidth(r[0] || '');
                    if (w > maxDateWidth) maxDateWidth = w;
                });
                const dateColWidth = Math.min(Math.max(Math.ceil(maxDateWidth) + 8, 26), 45);

                const baseWidths = menuType === 'səhər'
                    ? [120, 120]
                    : [38, 60, 42, 38, 41, 30];
                const baseTotal = baseWidths.reduce(function(a, b) { return a + b; }, 0);
                const available = TW - dateColWidth;
                const columnWidths = [dateColWidth].concat(
                    baseWidths.map(function(w) { return Math.round(w / baseTotal * available); })
                );

                const title = menuType === 'səhər' ? 'Məktəbəqədər hazırlıq səhər yeməyi menyusu' : 'Günorta Yeməyi Menyusu';

                doc.autoTable({
                    startY,
                    head: [columns],
                    body: tableData,
                    margin: { left: TM, right: 10, top: BH + 6, bottom: footerH + 4 },
                    tableWidth: TW,
                    columnStyles: columnWidths.map((width, index) => ({
                        cellWidth: width,
                        overflow: 'linebreak'
                    })),
                    styles: {
                        font: FN,
                        fontSize: 8,
                        cellPadding: { top: 2, bottom: 2, left: 3, right: 3 },
                        lineColor: [170, 210, 215],
                        lineWidth: 0.2,
                        textColor: [10, 31, 35],
                        fillColor: false
                    },
                    headStyles: {
                        font: FN,
                        fontStyle: 'bold',
                        fillColor: [0, 38, 47],
                        textColor: [255, 255, 255],
                        halign: 'center',
                        valign: 'middle',
                        fontSize: 9,
                        lineColor: [0, 82, 93],
                        lineWidth: 0.3,
                        minCellHeight: 8
                    },
                    bodyStyles: {
                        valign: 'middle',
                        minCellHeight: 7,
                        fillColor: false
                    },
                    didParseCell: function(data) {
                        if (data.section === 'body' && data.column.index === 0) {
                            data.cell.styles.fontStyle = 'bold';
                            data.cell.styles.fillColor = [0, 82, 93];
                            data.cell.styles.textColor = [255, 255, 255];
                        }
                    },
                    alternateRowStyles: {
                        fillColor: [232, 245, 247]
                    },
                    pageBreak: 'auto',
                    rowPageBreak: 'avoid',
                    showHead: 'everyPage',
                    willDrawPage: function() {
                        if (watermark) {
                            try {
                                doc.addImage(watermark, 'JPEG', wmX, wmY, wmSize, wmSize);
                            } catch (wmErr) {
                                console.warn('Filigran əlavə olunmadı:', wmErr);
                            }
                        }
                    },
                    didDrawPage: function(data) {
                        doc.setFillColor(0, 178, 140);
                        doc.rect(0, 0, PW, 0.9, 'F');
                        doc.setFillColor(0, 38, 47);
                        doc.rect(0, 0.9, PW, BH - 0.9, 'F');
                        doc.setFillColor(0, 82, 93);
                        doc.rect(0, BH - 8, PW, 8, 'F');
                        doc.setFillColor(0, 178, 140);
                        doc.rect(0, BH - 1.2, PW, 1.2, 'F');

                        if (logo) doc.addImage(logo, 'PNG', TXL, 5, LOGO, LOGO);

                        doc.setTextColor(255, 255, 255);
                        doc.setFont(FN, 'bold');
                        doc.setFontSize(15);
                        doc.text('Türkiyə Maarif Vəqfi', textX, 12);
                        doc.setFont(FN, 'normal');
                        doc.setFontSize(8.5);
                        doc.setTextColor(170, 215, 220);
                        doc.text('Azərbaycan Beynəlxalq Maarif Məktəbləri  ·  Nəsimi Kampusu', textX, 18);

                        doc.setFont(FN, 'bold');
                        doc.setFontSize(15);
                        doc.setTextColor(255, 255, 255);
                        doc.text(title, PW - TXR, 12, { align: 'right' });
                        doc.setFont(FN, 'normal');
                        doc.setFontSize(8.5);
                        doc.setTextColor(170, 215, 220);
                        doc.text('2026-2027 tədris ili', PW - TXR, 18, { align: 'right' });

                        const fY = PH - footerH;
                        doc.setFillColor(0, 38, 47);
                        doc.rect(0, fY, PW, footerH, 'F');
                        doc.setFillColor(0, 178, 140);
                        doc.rect(0, fY, PW, 0.7, 'F');

                        doc.setFont(FN, 'bold');
                        doc.setFontSize(9);
                        doc.setTextColor(255, 255, 255);
                        doc.text('Türkiyə Maarif Vəqfi  ·  Nəsimi Kampusu', PW / 2, fY + 4.5, { align: 'center', baseline: 'middle' });
                        doc.setFont(FN, 'normal');
                        doc.setFontSize(7.5);
                        doc.setTextColor(170, 215, 220);
                        doc.text('Azərbaycan Beynəlxalq Maarif Məktəbləri  ·  Yemək Menyusu', PW / 2, fY + 8.5, { align: 'center', baseline: 'middle' });
                    }
                });

                if (notes && notes.trim() !== '') {
                    const finalY = doc.lastAutoTable.finalY + 8;
                    doc.setFont(FN, 'bold');
                    doc.setFontSize(10);
                    doc.setTextColor(0, 82, 93);
                    doc.text('Qeydlər:', TM, finalY);
                    doc.setFont(FN, 'normal');
                    doc.setFontSize(9);
                    doc.setTextColor(50, 50, 50);
                    const splitNotes = doc.splitTextToSize(notes, PW - TM - 8);
                    doc.text(splitNotes, TM, finalY + 6);
                }

                let monthName = '', year = '';
                if (rows.length > 0) {
                    const firstRow = rows[0];
                    const dateISO = firstRow.dataset.dateISO;
                    if (dateISO) {
                        const dp = dateISO.split('-');
                        const date = new Date(parseInt(dp[0]), parseInt(dp[1]) - 1, parseInt(dp[2]));
                        const azMonths = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
                        monthName = azMonths[date.getMonth()];
                        year = date.getFullYear();
                    }
                }

                let fileName;
                if (menuType === 'səhər') {
                    fileName = `İMSA Nəsimi - ${year} ${monthName} səhər yeməyi menyusu.pdf`;
                    if (!year || !monthName) fileName = `İMSA Nəsimi - səhər yeməyi menyusu.pdf`;
                } else {
                    fileName = `İMSA Nəsimi - ${year} ${monthName} yemək menyusu.pdf`;
                    if (!year || !monthName) fileName = `İMSA Nəsimi - yemək menyusu.pdf`;
                }
                doc.save(fileName);

                const elapsed = Date.now() - startTime;
                const remainingTime = Math.max(0, 3000 - elapsed);
                setTimeout(() => {
                    window.hideLoading();
                    window.showToast('PDF faylı uğurla yükləndi', 'success');
                }, remainingTime);

            } catch (err) {
                window.hideLoading();
                console.error('PDF export error:', err);
                window.showToast('PDF ixrac edilə bilmədi: ' + err.message, 'error');
            }
        }

        function switchMenu(menuType) {
            // Update button states
            document.querySelectorAll('.menu-nav-btn').forEach(btn => {
                const isActive = btn.getAttribute('data-menu') === menuType;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            // Update section visibility
            document.querySelectorAll('.menu-page-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(menuType).classList.add('active');
        }

        // Tab klaviatura naviqasiyası (← → Home End)
        document.querySelectorAll('.menu-nav-btn').forEach(btn => {
            btn.addEventListener('keydown', function(e) {
                const keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'];
                if (keys.indexOf(e.key) === -1) return;
                e.preventDefault();
                const btns = Array.prototype.slice.call(document.querySelectorAll('.menu-nav-btn'));
                let idx = btns.indexOf(btn);
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') idx = (idx + 1) % btns.length;
                else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') idx = (idx - 1 + btns.length) % btns.length;
                else if (e.key === 'Home') idx = 0;
                else if (e.key === 'End') idx = btns.length - 1;
                switchMenu(btns[idx].getAttribute('data-menu'));
                btns[idx].focus();
            });
        });

        function initYemekPage() {
            // Auth check is handled by shared.js?v=63d72a239d
            // Show loading animation
            window.showLoading('Məlumat əldə edilir', 'Səbriniz üçün təşəkkür edirik!');
            applyMenuPermission();
        }

        // Birbaşa səhifə yüklənməsində DOMContentLoaded-də, SPA naviqasiyasında
        // (sidebar-dan keçəndə) isə dərhal icra olunur — DOMContentLoaded artıq keçib.
        // Birbaşa səhifə yüklənməsində də data sorğuları dərhal başlayır (HTML analizi ilə eşzamanlı)
        initYemekPage();

        // Yemək modulunda düzəliş icazəsi olanlar edit edə bilər, qalanlar yalnız baxır
        // Qeyd: yoxlama xətası verərsə (RPC/cədvəl yoxdur və s.) səhifə BAĞLANMIR —
        // defolt redaktə açıq qalır, real təhlükəsizlik DB RLS siyasətlərindədir.
        async function applyMenuPermission() {
            let canEdit = true;
            try {
                const { data: sessionData } = await _menuDb.auth.getSession();
                const email = sessionData && sessionData.session && sessionData.session.user
                    ? sessionData.session.user.email : null;
                if (!email) {
                    canEdit = false;
                } else {
                    try {
                        const { data: admin } = await _menuDb.rpc('is_admin');
                        canEdit = !!admin;
                    } catch (e) {
                        console.warn('is_admin RPC yoxlanıla bilmədi:', e);
                    }
                    if (!canEdit) {
                        try {
                            const { data: perm } = await _menuDb
                                .from('user_permissions')
                                .select('permission')
                                .eq('user_email', email)
                                .eq('page_id', 'yemek')
                                .eq('section_id', 'main')
                                .maybeSingle();
                            canEdit = !!(perm && perm.permission === 'edit');
                        } catch (e) {
                            console.warn('İcazə sorğusu xətası — redaktə açıq qalır:', e);
                            canEdit = true;
                        }
                    }
                }
            } catch (e) {
                console.warn('İcazə yoxlanışı xətası — redaktə açıq qalır:', e);
                canEdit = true;
            }
            window._menuCanEdit = canEdit;
            if (!canEdit) {
                document.querySelectorAll('.menu-section').forEach(function(sec) {
                    sec.classList.add('readonly');
                });
                document.querySelectorAll('td[contenteditable="true"]').forEach(function(cell) {
                    cell.setAttribute('contenteditable', 'false');
                });
                ['səhərNotes', 'günortaNotes'].forEach(function(id) {
                    var ta = document.getElementById(id);
                    if (ta) ta.readOnly = true;
                });
            }
            (async function() {
                try {
                    const { data: saherData } = await _menuDb.from('settings').select('value').eq('key', 'breakfast_menu_notes').maybeSingle();
                    const { data: gunortaData } = await _menuDb.from('settings').select('value').eq('key', 'lunch_menu_notes').maybeSingle();
                    if (saherData && saherData.value) document.getElementById('səhərNotes').value = saherData.value;
                    if (gunortaData && gunortaData.value) document.getElementById('günortaNotes').value = gunortaData.value;
                } catch (e) {
                    console.warn('Qeydlər yüklənərkən xəta:', e);
                }
                // Load menu from Supabase
                loadMenuFromSupabase();
            })();
        }
    </script>
</body>
</html>
